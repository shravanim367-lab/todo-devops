<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p>Organize your tasks, one step at a time.</p>

        <form action="/add" method="post" class="add-form">
            <input name="title" placeholder="Enter a task..." required>
            <button type="submit">Add Task</button>
        </form>

        <ul>
            {% for task in tasks %}
            <li>
                <span class="{% if task[2] %}done{% endif %}">
                    {{ task[1] }}
                </span>
                <div class="actions">
                    {% if not task[2] %}
                    <form action="/complete/{{ task[0] }}" method="post">
                        <button type="submit">Complete</button>
                    </form>
                    {% endif %}
                    <form action="/delete/{{ task[0] }}" method="post">
                        <button class="delete" type="submit">Delete</button>
                    </form>
                </div>
            </li>
            {% else %}
            <li>No tasks yet. Add your first task!</li>
            {% endfor %}
        </ul>

        <p class="status">Application health: <a href="/health">Check status</a></p>
    </main>
</body>
</html>
